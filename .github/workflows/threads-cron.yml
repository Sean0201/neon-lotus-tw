# Threads 排程發文:取代 vercel.json 的 crons(Cloudflare Pages 沒有內建排程)
# 時間與原本相同:UTC 04:00 / 12:00 = 台灣 12:00 / 20:00
#
# 需要在 GitHub → Settings → Secrets and variables → Actions 設定:
#   SITE_URL     例:https://www.neonlotus-tw.com
#   CRON_SECRET  與 Cloudflare 後台的 CRON_SECRET 相同
name: threads-publish-due
on:
  schedule:
    - cron: '0 4,12 * * *'
  workflow_dispatch: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/threads-publish-due
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL 未設定,略過"; exit 0; fi
          code=$(curl -sS -o out.json -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" "${SITE_URL%/}/api/threads-publish-due")
          cat out.json; echo
          test "$code" = "200"
